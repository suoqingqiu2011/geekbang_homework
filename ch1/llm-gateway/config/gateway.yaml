# ═══════════════════════════════════════════════════════════
# LLM Gateway — Provider & Model Configuration
# Hot-reloaded atomically on file change (no restart required)
# ═══════════════════════════════════════════════════════════

server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  log_level: INFO
  # 反向代理信任边界：默认 false，即完全不采信 X-Forwarded-For，
  # trace 的 client_ip 一律取 TCP 对端地址（客户端无法伪造）。
  # 部署在 nginx/网关之后时需要置为 true，并把代理地址加入 trusted_proxies，
  # 否则所有请求的 client_ip 都会变成代理自身地址（如 127.0.0.1）。
  trust_proxy_headers: false
  # 可信代理地址，支持单 IP 与 CIDR。仅当直连对端命中此列表时才解析 XFF，
  # 且从右向左取第一个非可信地址（左侧可能被客户端伪造）。
  trusted_proxies:
    - "127.0.0.1"
    - "::1"

storage:
  db_path: data/metrics.db
  tracing_ttl: 3600.0
  # 观察表（unbilled_attempt_costs）保留天数；仅影响该表，<=0 表示不清理
  unbilled_retention_days: 30

rate_limit:
  # Token bucket: tokens refilled per second
  refill_rate: 10.0
  bucket_capacity: 50
  # granularity ceilings (per-model checked first, most restrictive wins)
  per_model: 10
  per_endpoint: 100
  per_project: 1000
  per_user: 5000

circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 30.0
  half_open_max_calls: 3

http_pool:
  max_connections: 100
  max_keepalive: 20
  connect_timeout: 5.0
  read_timeout: 60.0

api_keys: []
# 网关准入 Key 不再写死在版本库，统一由环境变量注入（逗号分隔）：
#   GATEWAY_API_KEYS=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# 生成方式：python -c "import secrets; print(secrets.token_urlsafe(32))"
# 注意：长度 < 32 或使用默认弱口令时，GATEWAY_ENV=production 下网关将拒绝启动。
#
# 主体绑定写法（可选）：绑定后 user/project 以服务端为准，
# budget_usd 为该 Key 的硬性单请求上限，客户端只能收紧不能放开。
# api_keys:
#   - key: sk-team-a-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#     user: team-a
#     project: proj-a
#     budget_usd: 0.05

providers:
  deepseek:
    api_base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    # 单一均价仅作兼容回退；分价存在时，计费/预算/路由均以分价为准
    cost_per_million_tokens: 1.0
    cost_prompt_per_million_tokens: 0.5
    cost_completion_per_million_tokens: 2.0
    thinking_capability: 0.8
    capacity: 10
    timeout: 60.0
    structured_output: json_object  # 仅支持 json_object，且 prompt 需含 "json"
    model_aliases:
      deepseek-chat: deepseek-chat
      deepseek-reasoner: deepseek-reasoner
  openai:
    api_base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    cost_per_million_tokens: 10.0
    cost_prompt_per_million_tokens: 2.5
    cost_completion_per_million_tokens: 10.0
    thinking_capability: 0.9
    capacity: 10
    timeout: 60.0
    structured_output: json_schema  # 支持原生 Structured Outputs
    model_aliases:
      gpt-5: gpt-5
      gpt-4o: gpt-4o
  kimi:
    api_base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
    cost_per_million_tokens: 2.0
    cost_prompt_per_million_tokens: 1.0
    cost_completion_per_million_tokens: 3.5
    thinking_capability: 0.85
    capacity: 10
    timeout: 60.0
    structured_output: json_object
    model_aliases:
      kimi-k2: kimi-k2-thinking
      kimi-latest: moonshot-v1-128k
  qwen:
    api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    cost_per_million_tokens: 1.5
    cost_prompt_per_million_tokens: 0.8
    cost_completion_per_million_tokens: 3.0
    thinking_capability: 0.75
    capacity: 10
    timeout: 60.0
    structured_output: json_object
    model_aliases:
      qwen-max: qwen-max
      qwen-plus: qwen-plus
  anthropic:
    api_base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    cost_per_million_tokens: 15.0
    cost_prompt_per_million_tokens: 3.0
    cost_completion_per_million_tokens: 15.0
    thinking_capability: 0.95
    capacity: 5
    timeout: 60.0
    structured_output: none  # 无原生 response_format，适配器用提示约束兜底
    model_aliases:
      claude-3-5-sonnet: claude-3-5-sonnet-20241022
  ollama:
    api_base_url: http://localhost:11434/v1
    # 本地服务无鉴权：不配置 api_key_env（避免无 Key 时构造非法空 Authorization 头）
    cost_per_million_tokens: 0.0
    cost_prompt_per_million_tokens: 0.0
    cost_completion_per_million_tokens: 0.0
    thinking_capability: 0.4
    capacity: 3
    timeout: 120.0
    structured_output: json_object
    model_aliases:
      ollama-llama3: llama3

# Exposed model names (OpenAI-compatible /v1/models and request "model")
available_models:
  - name: deepseek-chat
    provider: deepseek
    routing_weight: 1.0
    # 可选：上下文窗口软过滤（省略或 0 = 不限制）。
    # 估算 prompt+max_tokens 超过该值的候选会被跳过；若全部候选超限则回退到全量候选。
    # context_window: 65536
  - name: deepseek-reasoner
    provider: deepseek
    routing_weight: 0.9
  - name: gpt-5
    provider: openai
    routing_weight: 1.0
  - name: gpt-4o
    provider: openai
    routing_weight: 0.7
  - name: kimi-k2
    provider: kimi
    routing_weight: 0.8
  - name: qwen-max
    provider: qwen
    routing_weight: 0.6
  - name: claude-3-5-sonnet
    provider: anthropic
    routing_weight: 0.9
  - name: ollama-llama3
    provider: ollama
    routing_weight: 0.3
