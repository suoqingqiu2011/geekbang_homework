# LLM Gateway — Docker Compose（H3，待评审定稿）
# 用法：docker compose up -d
# 数据卷 gateway-data 持久化 SQLite；配置目录挂载支持热更新

services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: llm-gateway:1.0.0
    container_name: llm-gateway
    env_file: .env
    ports:
      # 默认只绑回环地址，避免"起容器即对外暴露网关"；需要外网访问请经 Nginx 反代。
      - "127.0.0.1:8000:8000"
    volumes:
      - gateway-data:/srv/gateway/data
      - ./config:/srv/gateway/config:ro
    restart: unless-stopped

  # 可选：本地/离线跑完整 pytest。默认不启动，避免 docker compose up 误跑测试。
  # 用法：docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    image: llm-gateway-test:1.0.0
    command: python -m pytest tests -q

volumes:
  gateway-data:
