[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
# llama-index-core 0.12.x 在 Annotated 别名中使用 Field(validate_default=True)，
# pydantic >= 2.11 会提示该属性无效（上游 0.14 已修复）。
filterwarnings =
    ignore:The 'validate_default' attribute with value True was provided to the `Field\(\)` function
